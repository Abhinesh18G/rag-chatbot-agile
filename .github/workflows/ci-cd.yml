name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ---------------------------------------------------
  # 1. LINT — fast feedback, fails first if style is broken
  # ---------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 . --max-line-length=100 --exclude=.venv,venv

      - name: Check formatting with black
        run: black --check .

  # ---------------------------------------------------
  # 2. TEST — unit tests, no API key/network required
  # ---------------------------------------------------
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ---------------------------------------------------
  # 3. BUILD — verify the Docker image builds on every PR/push
  # ---------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-chatbot:${{ github.sha }} .

  # ---------------------------------------------------
  # 4. PUSH — only on main, publish image to Docker Hub
  # ---------------------------------------------------
  push:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-chatbot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-chatbot:${{ github.sha }}

  # ---------------------------------------------------
  # 5. DEPLOY — placeholder trigger for your chosen host
  #    (Render/Railway/Streamlit Cloud all support deploy webhooks)
  # ---------------------------------------------------
  deploy:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"image": "${{ github.sha }}"}'
